[package]
name = "agent-harness-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Google Gemini API provider for agent-harness (standard + Live WebSocket)"

[features]
default = ["live"]
live = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
agent-harness-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }

tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
