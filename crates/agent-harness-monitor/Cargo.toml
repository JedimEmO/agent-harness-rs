[package]
name = "agent-harness-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Observability and monitoring for agent-harness — captures all LLM, MCP, and live session traffic to SQLite with real-time streaming"

[dependencies]
agent-harness-core = { workspace = true }
agent-harness-mcp = { path = "../agent-harness-mcp" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
libsqlite3-sys = { workspace = true }
async-stream = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
