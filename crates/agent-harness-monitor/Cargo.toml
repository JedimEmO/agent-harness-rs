[package]
name = "agent-harness-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Observability and monitoring for agent-harness — captures all LLM, MCP, and live session traffic to SQLite with real-time streaming"

[features]
default = []
server = ["dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]
agent-harness-core = { workspace = true }
agent-harness-mcp = { path = "../agent-harness-mcp" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
libsqlite3-sys = { workspace = true }
async-stream = { workspace = true }

# Optional: server feature
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
