[package]
name = "agent-harness-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types, traits, and agent runner for the agent-harness LLM agent framework"

[features]
default = ["context-pipeline"]
context-pipeline = ["dep:agent-harness-context"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
agent-harness-context = { workspace = true, optional = true }
